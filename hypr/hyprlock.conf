# hyprlock — Sperre der Sway-Session im HL2-HUD-Stil (2004).
# Aufruf nur ueber ~/.config/sway/scripts/lock.sh (mit swaylock als Fallback).
# Farben aus hl2/resource/ClientScheme.res, wie waybar und eww:
#   BrightFg #FFDC00 · FgColor 255 220 0 100 · DamagedBg 180 0 0 200
# Kaesten warm aufgehellt statt schwarz, sonst verschwinden sie im Wallpaper.

$hud    = rgba(255, 220, 0, 1.0)
$label  = rgba(255, 220, 0, 0.7)
$edge   = rgba(255, 220, 0, 0.14)
$box    = rgba(40, 36, 24, 0.55)
$glow   = rgba(255, 220, 0, 0.5)
$font   = Verdana Bold

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/osa/Private/wallpaper.jpg
    brightness = 0.85
}

# ── Mitte: unter dem λ ──────────────────────────────────────────────────────
label {
    monitor =
    text = SUIT LOCKED
    color = $hud
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 0, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 10
    outer_color = $edge
    inner_color = $box
    font_color = $hud
    font_family = $font
    check_color = $hud
    fail_color = rgba(255, 0, 0, 1.0)
    capslock_color = rgba(255, 90, 60, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##FFDC00B3">PASSWORT</span>
    fail_text = ZUGRIFF VERWEIGERT
    dots_spacing = 0.3
    position = 0, -240
    halign = center
    valign = center
}

# ── unten links: HEALTH (Akku) + SUIT (Tagesziel) wie im eww-HUD ────────────
shape {
    monitor =
    size = 170, 60
    color = $box
    rounding = 10
    border_size = 1
    border_color = $edge
    position = 32, 32
    halign = left
    valign = bottom
}
label {
    monitor =
    text = HEALTH
    color = $label
    font_size = 11
    font_family = $font
    position = 48, 44
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT0/capacity
    color = $hud
    font_size = 34
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 120, 38
    halign = left
    valign = bottom
}

shape {
    monitor =
    size = 150, 60
    color = $box
    rounding = 10
    border_size = 1
    border_color = $edge
    position = 214, 32
    halign = left
    valign = bottom
}
label {
    monitor =
    text = SUIT
    color = $label
    font_size = 11
    font_family = $font
    position = 230, 44
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] eww get learn 2>/dev/null | jq -r '.suit // 0'
    color = $hud
    font_size = 34
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 290, 38
    halign = left
    valign = bottom
}

# ── unten rechts: Uhr ───────────────────────────────────────────────────────
shape {
    monitor =
    size = 190, 60
    color = $box
    rounding = 10
    border_size = 1
    border_color = $edge
    position = -32, 32
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] date +%a | tr a-z A-Z
    color = $label
    font_size = 11
    font_family = $font
    position = -170, 44
    halign = right
    valign = bottom
}
label {
    monitor =
    text = $TIME
    color = $hud
    font_size = 34
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = -48, 38
    halign = right
    valign = bottom
}
