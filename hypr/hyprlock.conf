# hyprlock — Sperre der Sway-Session im HL2-HUD-Stil (2004).
# Aufruf nur ueber ~/.config/sway/scripts/lock.sh (mit swaylock als Fallback).
# Farben aus hl2/resource/ClientScheme.res, wie waybar und eww:
#   BrightFg #FFDC00 · FgColor 255 220 0 100 · DamagedBg 180 0 0 200
# Kaesten warm aufgehellt statt schwarz, sonst verschwinden sie im Wallpaper.

$hud    = rgba(255, 220, 0, 1.0)
$label  = rgba(255, 220, 0, 0.7)
$edge   = rgba(255, 220, 0, 0.14)
$box    = rgba(40, 36, 24, 0.55)
$glow   = rgba(255, 220, 0, 0.5)
$font   = Verdana Bold

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/osa/Private/wallpaper.jpg
    brightness = 0.85
}

# ── Mitte: unter dem λ ──────────────────────────────────────────────────────
# LOADING... -> SUIT LOCKED, darunter der Ladebalken (loading.sh, 2 s).
label {
    monitor =
    text = cmd[update:100] ~/.config/hypr/loading.sh text
    color = $hud
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 0, -170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100] ~/.config/hypr/loading.sh bar
    color = $hud
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 0, -215
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 10
    outer_color = $edge
    inner_color = $box
    font_color = $hud
    font_family = $font
    check_color = $hud
    fail_color = rgba(255, 0, 0, 1.0)
    capslock_color = rgba(255, 90, 60, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##FFDC00B3">PASSWORT</span>
    fail_text = ZUGRIFF VERWEIGERT
    dots_spacing = 0.3
    position = 0, -280
    halign = center
    valign = center
}

# ── unten: HEALTH (Akku), SUIT (Tagesziel), Uhr — wie das eww-HUD ──────────
# Pro Kasten EIN Label (Beschriftung + Zahl per Pango in einer Zeile): zwei
# getrennt platzierte Labels verrutschen gegeneinander, weil hyprlock jedes
# an seiner eigenen Kante ausrichtet. Pango setzt beide auf eine Grundlinie.
# fgalpha statt foreground='#..', weil # in hyprlang ein Kommentar ist.
shape {
    monitor =
    size = 226, 64          # breitester Text "HEALTH   100" = 190px + 2x18
    color = $box
    rounding = 10
    border_size = 1
    border_color = $edge
    position = 32, 32
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] echo "<span size='11pt' fgalpha='70%'>HEALTH</span>   $(cat /sys/class/power_supply/BAT0/capacity)"
    color = $hud
    font_size = 30
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 50, 39
    halign = left
    valign = bottom
}

shape {
    monitor =
    size = 202, 64          # "SUIT   100" = 166px + 2x18
    color = $box
    rounding = 10
    border_size = 1
    border_color = $edge
    position = 270, 32
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] echo "<span size='11pt' fgalpha='70%'>SUIT</span>   $(eww get learn 2>/dev/null | jq -r '.suit // 0')"
    color = $hud
    font_size = 30
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = 288, 39
    halign = left
    valign = bottom
}

shape {
    monitor =
    size = 245, 64          # "WED   23:59" = 209px + 2x18 (gemessen mit pango-view)
    color = $box
    rounding = 10
    border_size = 1
    border_color = $edge
    position = -32, 32
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:10000] date +"<span size='11pt' fgalpha='70%%'>%^a</span>   %H:%M"
    color = $hud
    font_size = 30
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glow
    position = -50, 39
    halign = right
    valign = bottom
}
